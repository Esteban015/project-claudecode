name: PR Checks

on:
  pull_request:
    branches: [master]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ── 1. Build ────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ── 2. Deploy preview to Netlify ────────────────────────────────────────────
  preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pull-requests: write
    outputs:
      preview_url: ${{ steps.deploy.outputs.deploy-url }}
    steps:
      - uses: actions/checkout@v4

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Deploy preview to Netlify
        id: deploy
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: dist
          production-deploy: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "PR #${{ github.event.pull_request.number }} – ${{ github.event.pull_request.title }}"
          enable-pull-request-comment: true
          enable-commit-comment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  # ── 3. TestSprite – tests automatizados ────────────────────────────────────
  # @testsprite/testsprite-mcp es un servidor MCP para uso interactivo con
  # Claude Code. Para CI headless, reemplazar este step con la llamada a la
  # API REST de TestSprite cuando esté disponible:
  #
  #   curl -X POST https://api.testsprite.com/v1/runs \
  #     -H "Authorization: Bearer $TESTSPRITE_API_KEY" \
  #     -d '{"url":"'"$PREVIEW_URL"'","plan":"testsprite_tests/test-plan.json"}'
  testsprite:
    name: TestSprite
    runs-on: ubuntu-latest
    needs: preview
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run TestSprite tests
        env:
          TESTSPRITE_API_KEY: ${{ secrets.TESTSPRITE_API_KEY }}
          PREVIEW_URL: ${{ needs.preview.outputs.preview_url }}
        run: |
          echo "Preview URL bajo test: $PREVIEW_URL"
          # Reemplazar con llamada a la API REST de TestSprite cuando esté disponible.
          # Por ahora se valida que la preview URL existe y responde HTTP 200.
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" "$PREVIEW_URL")
          if [ "$STATUS" != "200" ]; then
            echo "::error::La preview URL respondió HTTP $STATUS (esperado 200)"
            exit 1
          fi
          echo "✓ Preview responde HTTP 200 — listo para integrar TestSprite API"
