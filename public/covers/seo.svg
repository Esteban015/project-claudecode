<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F0F1A"/>
      <stop offset="100%" style="stop-color:#1A1A2E"/>
    </linearGradient>
    <linearGradient id="barGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED"/>
      <stop offset="100%" style="stop-color:#4F46E5"/>
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#A78BFA"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="spotlight" cx="65%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#0F0F1A;stop-opacity:0"/>
    </radialGradient>
    <clipPath id="chartClip">
      <rect x="630" y="150" width="510" height="350" rx="16"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#spotlight)"/>

  <!-- Chart card -->
  <rect x="630" y="150" width="510" height="350" rx="16" fill="#1A1A2E" stroke="#2D2B55" stroke-width="1"/>

  <!-- Chart grid -->
  <g stroke="#2D2B55" stroke-width="1" clip-path="url(#chartClip)">
    <line x1="630" y1="230" x2="1140" y2="230"/>
    <line x1="630" y1="300" x2="1140" y2="300"/>
    <line x1="630" y1="370" x2="1140" y2="370"/>
    <line x1="630" y1="440" x2="1140" y2="440"/>
  </g>

  <!-- Chart bars -->
  <rect x="680" y="390" width="50" height="100" rx="6" fill="url(#barGrad1)" opacity="0.7"/>
  <rect x="760" y="340" width="50" height="150" rx="6" fill="url(#barGrad1)" opacity="0.8"/>
  <rect x="840" y="280" width="50" height="210" rx="6" fill="url(#barGrad2)" filter="url(#glow)"/>
  <rect x="920" y="260" width="50" height="230" rx="6" fill="url(#barGrad2)" filter="url(#glow)" opacity="0.95"/>
  <rect x="1000" y="210" width="50" height="280" rx="6" fill="url(#barGrad1)" filter="url(#glow)"/>

  <!-- Bar labels -->
  <text x="705" y="505" font-family="system-ui, sans-serif" font-size="12" fill="#9CA3AF" text-anchor="middle">Ene</text>
  <text x="785" y="505" font-family="system-ui, sans-serif" font-size="12" fill="#9CA3AF" text-anchor="middle">Feb</text>
  <text x="865" y="505" font-family="system-ui, sans-serif" font-size="12" fill="#9CA3AF" text-anchor="middle">Mar</text>
  <text x="945" y="505" font-family="system-ui, sans-serif" font-size="12" fill="#9CA3AF" text-anchor="middle">Abr</text>
  <text x="1025" y="505" font-family="system-ui, sans-serif" font-size="12" fill="#A78BFA" text-anchor="middle" font-weight="600">May</text>

  <!-- Chart title -->
  <text x="660" y="190" font-family="system-ui, sans-serif" font-size="14" fill="#9CA3AF">Tráfico orgánico</text>
  <text x="1120" y="190" font-family="system-ui, sans-serif" font-size="13" fill="#86EFAC" text-anchor="end">↑ 340%</text>

  <!-- Trend line -->
  <polyline points="705,390 785,340 865,280 945,260 1025,210" fill="none" stroke="#A78BFA" stroke-width="2" stroke-dasharray="5 3" opacity="0.6"/>

  <!-- Search icon magnifier -->
  <g transform="translate(60, 140)" filter="url(#glow)">
    <circle cx="80" cy="80" r="55" fill="none" stroke="#7C3AED" stroke-width="6"/>
    <circle cx="80" cy="80" r="38" fill="#1A1A2E" stroke="#2D2B55" stroke-width="1"/>
    <!-- SERP lines inside -->
    <rect x="60" y="64" width="40" height="5" rx="2.5" fill="#7C3AED" opacity="0.9"/>
    <rect x="60" y="76" width="30" height="4" rx="2" fill="#4B5563"/>
    <rect x="60" y="86" width="35" height="4" rx="2" fill="#4B5563"/>
    <rect x="60" y="96" width="25" height="4" rx="2" fill="#4B5563"/>
    <!-- Handle -->
    <line x1="122" y1="122" x2="155" y2="155" stroke="#7C3AED" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Metric pills -->
  <rect x="60" y="310" width="160" height="44" rx="22" fill="#1A1A2E" stroke="#7C3AED" stroke-width="1"/>
  <text x="90" y="330" font-family="system-ui, sans-serif" font-size="11" fill="#9CA3AF">LCP</text>
  <text x="90" y="347" font-family="system-ui, sans-serif" font-size="14" fill="#86EFAC" font-weight="700">0.8s ✓</text>

  <rect x="240" y="310" width="160" height="44" rx="22" fill="#1A1A2E" stroke="#7C3AED" stroke-width="1"/>
  <text x="270" y="330" font-family="system-ui, sans-serif" font-size="11" fill="#9CA3AF">CLS</text>
  <text x="270" y="347" font-family="system-ui, sans-serif" font-size="14" fill="#86EFAC" font-weight="700">0.0 ✓</text>

  <rect x="60" y="368" width="160" height="44" rx="22" fill="#1A1A2E" stroke="#7C3AED" stroke-width="1"/>
  <text x="90" y="388" font-family="system-ui, sans-serif" font-size="11" fill="#9CA3AF">INP</text>
  <text x="90" y="405" font-family="system-ui, sans-serif" font-size="14" fill="#86EFAC" font-weight="700">48ms ✓</text>

  <rect x="240" y="368" width="160" height="44" rx="22" fill="#1A1A2E" stroke="#A78BFA" stroke-width="1.5" filter="url(#glow)"/>
  <text x="270" y="388" font-family="system-ui, sans-serif" font-size="11" fill="#9CA3AF">Score</text>
  <text x="270" y="405" font-family="system-ui, sans-serif" font-size="15" fill="#A78BFA" font-weight="800">100 🏆</text>

  <!-- Main text -->
  <text x="60" y="215" font-family="system-ui, sans-serif" font-size="20" fill="#A78BFA" font-weight="600">SEO Técnico</text>
  <text x="60" y="268" font-family="system-ui, sans-serif" font-size="54" font-weight="800" fill="#E5E7EB">Guía definitiva</text>
  <text x="60" y="300" font-family="system-ui, sans-serif" font-size="22" fill="#9CA3AF">Core Web Vitals · Structured Data</text>
  <text x="60" y="328" font-family="system-ui, sans-serif" font-size="22" fill="#9CA3AF">Open Graph · Sitemaps</text>

  <!-- Bottom bar -->
  <rect x="0" y="590" width="1200" height="40" fill="#1A1A2E"/>
  <text x="60" y="616" font-family="system-ui, sans-serif" font-size="16" fill="#6B7280">Mi Blog</text>
  <text x="1140" y="616" font-family="system-ui, sans-serif" font-size="16" fill="#6B7280" text-anchor="end">seo</text>
</svg>
