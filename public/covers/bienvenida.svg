<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F0F1A"/>
      <stop offset="100%" style="stop-color:#1A1A2E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED"/>
      <stop offset="100%" style="stop-color:#4F46E5"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="spotlight" cx="50%" cy="50%" r="60%">
      <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#0F0F1A;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#spotlight)"/>

  <!-- Grid lines -->
  <g stroke="#2D2B55" stroke-width="1" opacity="0.5">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Decorative hexagons -->
  <polygon points="950,80 990,102 990,148 950,170 910,148 910,102" fill="none" stroke="#7C3AED" stroke-width="2" opacity="0.6" filter="url(#glow)"/>
  <polygon points="1050,200 1080,217 1080,252 1050,269 1020,252 1020,217" fill="none" stroke="#4F46E5" stroke-width="1.5" opacity="0.4"/>
  <polygon points="150,480 180,497 180,532 150,549 120,532 120,497" fill="none" stroke="#7C3AED" stroke-width="1.5" opacity="0.4"/>
  <polygon points="900,450 940,472 940,518 900,540 860,518 860,472" fill="none" stroke="#7C3AED" stroke-width="1" opacity="0.25"/>

  <!-- Dots -->
  <circle cx="100" cy="100" r="3" fill="#7C3AED" opacity="0.7"/>
  <circle cx="300" cy="50" r="2" fill="#7C3AED" opacity="0.5"/>
  <circle cx="1100" cy="550" r="3" fill="#4F46E5" opacity="0.6"/>
  <circle cx="80" cy="580" r="2" fill="#7C3AED" opacity="0.4"/>

  <!-- Main hexagon logo -->
  <polygon points="200,240 260,275 260,345 200,380 140,345 140,275" fill="url(#accent)" filter="url(#glow)"/>
  <text x="200" y="325" font-family="system-ui, sans-serif" font-size="72" font-weight="700" fill="white" text-anchor="middle">M</text>

  <!-- Text content -->
  <text x="320" y="290" font-family="system-ui, sans-serif" font-size="52" font-weight="700" fill="#E5E7EB">Bienvenido</text>
  <text x="320" y="355" font-family="system-ui, sans-serif" font-size="52" font-weight="700" fill="#E5E7EB">al blog 👋</text>
  <text x="320" y="410" font-family="system-ui, sans-serif" font-size="22" fill="#9CA3AF">Mi espacio en internet para compartir ideas</text>

  <!-- Tag pill -->
  <rect x="320" y="240" width="100" height="30" rx="15" fill="#7C3AED" opacity="0.3"/>
  <rect x="320" y="240" width="100" height="30" rx="15" fill="none" stroke="#7C3AED" stroke-width="1"/>
  <text x="370" y="260" font-family="system-ui, sans-serif" font-size="14" fill="#A78BFA" text-anchor="middle">general</text>

  <!-- Bottom bar -->
  <rect x="0" y="590" width="1200" height="40" fill="#1A1A2E"/>
  <text x="60" y="616" font-family="system-ui, sans-serif" font-size="16" fill="#6B7280">Mi Blog</text>
  <text x="1140" y="616" font-family="system-ui, sans-serif" font-size="16" fill="#6B7280" text-anchor="end">2026</text>
</svg>
