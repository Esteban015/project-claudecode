<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F0F1A"/>
      <stop offset="100%" style="stop-color:#0D0D20"/>
    </linearGradient>
    <linearGradient id="rocketGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#A78BFA"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
    <radialGradient id="orb" cx="70%" cy="30%" r="40%">
      <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#0F0F1A;stop-opacity:0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="20" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#orb)"/>

  <!-- Stars -->
  <circle cx="120" cy="80" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="350" cy="45" r="1" fill="white" opacity="0.5"/>
  <circle cx="780" cy="90" r="2" fill="white" opacity="0.7"/>
  <circle cx="1050" cy="60" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="950" cy="150" r="1" fill="white" opacity="0.4"/>
  <circle cx="1150" cy="200" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="60" cy="400" r="1" fill="white" opacity="0.4"/>
  <circle cx="200" cy="550" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="1100" cy="500" r="2" fill="white" opacity="0.6"/>
  <circle cx="500" cy="30" r="1" fill="white" opacity="0.5"/>
  <circle cx="650" cy="580" r="1.5" fill="white" opacity="0.4"/>
  <circle cx="850" cy="520" r="1" fill="white" opacity="0.6"/>

  <!-- Orbit rings -->
  <ellipse cx="900" cy="315" rx="180" ry="180" fill="none" stroke="#2D2B55" stroke-width="1" stroke-dasharray="4 6" opacity="0.6"/>
  <ellipse cx="900" cy="315" rx="120" ry="120" fill="none" stroke="#2D2B55" stroke-width="1" stroke-dasharray="4 6" opacity="0.4"/>

  <!-- Planet -->
  <circle cx="900" cy="315" r="70" fill="#1A1A2E" stroke="#2D2B55" stroke-width="2"/>
  <circle cx="900" cy="315" r="70" fill="none" stroke="#7C3AED" stroke-width="1" opacity="0.5"/>
  <ellipse cx="900" cy="315" rx="110" ry="25" fill="none" stroke="#7C3AED" stroke-width="1.5" opacity="0.7" filter="url(#glow)"/>
  <!-- Planet surface lines -->
  <path d="M 850 290 Q 900 275 950 290" fill="none" stroke="#2D2B55" stroke-width="1.5"/>
  <path d="M 840 315 Q 900 300 960 315" fill="none" stroke="#2D2B55" stroke-width="1.5"/>
  <path d="M 850 340 Q 900 355 950 340" fill="none" stroke="#2D2B55" stroke-width="1.5"/>

  <!-- Rocket -->
  <g transform="translate(195,155) rotate(-30, 60, 120)">
    <!-- Flame -->
    <ellipse cx="60" cy="195" rx="12" ry="22" fill="#F59E0B" opacity="0.9" filter="url(#softglow)"/>
    <ellipse cx="60" cy="192" rx="7" ry="14" fill="#FDE68A" opacity="0.9"/>
    <!-- Body -->
    <path d="M 40 170 L 40 100 Q 60 60 80 100 L 80 170 Z" fill="url(#rocketGrad)"/>
    <!-- Window -->
    <circle cx="60" cy="120" r="12" fill="#1A1A2E" stroke="#A78BFA" stroke-width="2"/>
    <circle cx="60" cy="120" r="6" fill="#7C3AED" opacity="0.8"/>
    <!-- Fins -->
    <path d="M 40 160 L 25 185 L 40 175 Z" fill="#6D28D9"/>
    <path d="M 80 160 L 95 185 L 80 175 Z" fill="#6D28D9"/>
  </g>

  <!-- Code snippet decoration -->
  <rect x="60" y="380" width="380" height="120" rx="12" fill="#1A1A2E" stroke="#2D2B55" stroke-width="1"/>
  <text x="90" y="415" font-family="monospace" font-size="14" fill="#7C3AED">import</text>
  <text x="150" y="415" font-family="monospace" font-size="14" fill="#E5E7EB">{ defineConfig }</text>
  <text x="90" y="440" font-family="monospace" font-size="14" fill="#7C3AED">from</text>
  <text x="135" y="440" font-family="monospace" font-size="14" fill="#86EFAC">'astro'</text>
  <text x="90" y="470" font-family="monospace" font-size="14" fill="#9CA3AF">// Zero JS by default ✓</text>

  <!-- Main text -->
  <text x="60" y="230" font-family="system-ui, sans-serif" font-size="20" fill="#A78BFA" font-weight="600">Framework</text>
  <text x="60" y="285" font-family="system-ui, sans-serif" font-size="58" font-weight="800" fill="#E5E7EB">Por qué Astro</text>
  <text x="60" y="345" font-family="system-ui, sans-serif" font-size="58" font-weight="800" fill="#E5E7EB">es el mejor</text>

  <!-- Bottom bar -->
  <rect x="0" y="590" width="1200" height="40" fill="#1A1A2E"/>
  <text x="60" y="616" font-family="system-ui, sans-serif" font-size="16" fill="#6B7280">Mi Blog</text>
  <text x="1140" y="616" font-family="system-ui, sans-serif" font-size="16" fill="#6B7280" text-anchor="end">desarrollo-web</text>
</svg>
